name: junction_flutter_1
description: "Anti-scam app for elderly users with AI-powered call analysis"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  
  # Twilio Voice SDK for VoIP calls
  twilio_voice: ^0.3.2+2
  
  # Firebase for push notifications (required for Twilio on Android)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  
  # Notifications
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  
  # Vibration and sound
  audioplayers: ^6.0.0
  
  # HTTP and backend
  dio: ^5.4.3+1
  
  # State management
  provider: ^6.1.2
  
  # Utilities
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  
  # Background tasks
  # workmanager: ^0.5.2  # Disabled due to build errors - using FCM push notifications instead

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # Assets for alarm sounds
  assets:
    - assets/sounds/
    - assets/images/
